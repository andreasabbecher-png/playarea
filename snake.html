<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d7e6b2">
  <title>Snake – Retro Edition</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #25351e;
      --screen: #c8d99a;
      --screen-dark: #71854f;
      --body: #d9d8c9;
      --accent: #62754a;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 36%, #f1f0df 0, #d5d3c0 65%, #bbb9a8 100%);
      font-family: "Trebuchet MS", Arial, sans-serif;
    }

    .phone {
      width: min(100%, 390px);
      padding: 28px 24px 24px;
      border: 1px solid #f5f4e8;
      border-radius: 38px 38px 52px 52px;
      background: linear-gradient(140deg, #eeeddf, var(--body) 55%, #c7c6b7);
      box-shadow: 0 24px 45px #262b243b, inset 2px 2px 5px #fff9;
    }

    .brand {
      margin: 0 0 18px;
      color: #77776c;
      font-family: Georgia, serif;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 4px;
      text-align: center;
    }

    .brand span {
      display: block;
      margin-top: 3px;
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: 9px;
      font-weight: normal;
      letter-spacing: 3px;
    }

    .screen-frame {
      padding: 13px;
      border: 2px solid #aaa99a;
      border-radius: 15px 15px 22px 22px;
      background: #a7b27e;
      box-shadow: inset 0 2px 7px #39422c55, 0 1px 0 #fff9;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 0 2px 9px;
      font-family: "Courier New", monospace;
      font-size: 13px;
      font-weight: bold;
    }

    .game-wrap {
      position: relative;
      overflow: hidden;
      border: 2px solid #526340;
      border-radius: 3px;
      background: var(--screen);
      box-shadow: inset 0 0 18px #45543825;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      padding: 20px;
      background: #c8d99ae8;
      text-align: center;
    }

    .overlay[hidden] { display: none; }
    .overlay h2 {
      margin: 0 0 8px;
      font-family: "Courier New", monospace;
      font-size: clamp(21px, 7vw, 29px);
      letter-spacing: 2px;
    }

    .overlay p {
      margin: 0;
      font-family: "Courier New", monospace;
      font-size: 13px;
      line-height: 1.55;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 14px 2px 0;
    }

    button {
      min-height: 43px;
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      color: #f4f2e6;
      background: linear-gradient(#829266, #566844);
      box-shadow: 0 3px 0 #414e35, inset 0 1px 0 #ffffff45;
      font: bold 12px "Trebuchet MS", Arial, sans-serif;
      letter-spacing: 1px;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #414e35;
    }

    button:focus-visible {
      outline: 3px solid #34452c;
      outline-offset: 3px;
    }

    .hint {
      margin: 0;
      color: #52564a;
      font-size: 10px;
      line-height: 1.45;
      text-align: right;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 42px);
      grid-template-rows: repeat(2, 37px);
      justify-content: center;
      gap: 4px;
      margin: 22px auto 0;
    }

    .dpad button {
      min-height: 0;
      padding: 0;
      border-radius: 8px;
      font-size: 15px;
    }

    .dpad .up { grid-column: 2; grid-row: 1; }
    .dpad .left { grid-column: 1; grid-row: 2; }
    .dpad .down { grid-column: 2; grid-row: 2; }
    .dpad .right { grid-column: 3; grid-row: 2; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="Snake-Spiel im Retro-Handy-Design">
    <h1 class="brand">NOKIA<span>RETRO ARCADE</span></h1>
    <section class="screen-frame" aria-label="Spielbildschirm">
      <div class="hud" aria-live="polite">
        <span>PUNKTE: <span id="score">0</span></span>
        <span>BEST: <span id="best">0</span></span>
      </div>
      <div class="game-wrap">
        <canvas id="game" width="320" height="320" aria-label="Snake-Spielfeld"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="message-title">SNAKE</h2>
          <p id="message-text">Sammle Futter und werde länger.<br>Drücke eine Pfeiltaste zum Starten.</p>
        </div>
      </div>
      <div class="controls">
        <button id="start-button" type="button">START</button>
        <p class="hint">Pfeiltasten / WASD<br>Leertaste: Pause</p>
      </div>
    </section>
    <div class="dpad" aria-label="Steuerkreuz">
      <button class="up" data-direction="up" type="button" aria-label="Nach oben">▲</button>
      <button class="left" data-direction="left" type="button" aria-label="Nach links">◀</button>
      <button class="down" data-direction="down" type="button" aria-label="Nach unten">▼</button>
      <button class="right" data-direction="right" type="button" aria-label="Nach rechts">▶</button>
    </div>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const scoreLabel = document.querySelector("#score");
      const bestLabel = document.querySelector("#best");
      const overlay = document.querySelector("#overlay");
      const title = document.querySelector("#message-title");
      const message = document.querySelector("#message-text");
      const startButton = document.querySelector("#start-button");
      const cell = 16;
      const cells = canvas.width / cell;
      const tickMs = 115;
      let snake;
      let food;
      let direction;
      let nextDirection;
      let score = 0;
      let best = loadBest();
      let timer = null;
      let state = "ready";

      bestLabel.textContent = best;

      function loadBest() {
        try {
          return Number(localStorage.getItem("retro-snake-best")) || 0;
        } catch {
          return 0;
        }
      }

      function saveBest() {
        try {
          localStorage.setItem("retro-snake-best", String(best));
        } catch {
          // The game remains playable when storage is unavailable.
        }
      }

      function reset() {
        snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
        direction = { x: 1, y: 0 };
        nextDirection = direction;
        score = 0;
        scoreLabel.textContent = score;
        placeFood();
        draw();
      }

      function placeFood() {
        const empty = [];
        for (let y = 0; y < cells; y += 1) {
          for (let x = 0; x < cells; x += 1) {
            if (!snake.some((part) => part.x === x && part.y === y)) {
              empty.push({ x, y });
            }
          }
        }
        food = empty.length ? empty[Math.floor(Math.random() * empty.length)] : null;
      }

      function draw() {
        ctx.fillStyle = "#c8d99a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#71854f";
        if (food) {
          ctx.fillRect(food.x * cell + 3, food.y * cell + 3, cell - 6, cell - 6);
        }

        snake.forEach((part, index) => {
          ctx.fillStyle = index === 0 ? "#25351e" : "#435835";
          ctx.fillRect(part.x * cell + 1, part.y * cell + 1, cell - 2, cell - 2);
        });

        if (snake.length) {
          ctx.fillStyle = "#c8d99a";
          const head = snake[0];
          if (direction.x !== 0) {
            ctx.fillRect(head.x * cell + (direction.x > 0 ? 10 : 4), head.y * cell + 4, 2, 2);
            ctx.fillRect(head.x * cell + (direction.x > 0 ? 10 : 4), head.y * cell + 10, 2, 2);
          } else {
            ctx.fillRect(head.x * cell + 4, head.y * cell + (direction.y > 0 ? 10 : 4), 2, 2);
            ctx.fillRect(head.x * cell + 10, head.y * cell + (direction.y > 0 ? 10 : 4), 2, 2);
          }
        }
      }

      function start() {
        if (state === "running") return;
        if (state === "ready" || state === "over") reset();
        state = "running";
        overlay.hidden = true;
        startButton.textContent = "PAUSE";
        clearInterval(timer);
        timer = setInterval(step, tickMs);
      }

      function pause() {
        if (state !== "running") return;
        clearInterval(timer);
        timer = null;
        state = "paused";
        title.textContent = "PAUSE";
        message.innerHTML = "Drücke die Leertaste oder<br>START zum Weiterspielen.";
        overlay.hidden = false;
        startButton.textContent = "WEITER";
      }

      function endGame(won = false) {
        clearInterval(timer);
        timer = null;
        state = "over";
        title.textContent = won ? "GEWONNEN!" : "GAME OVER";
        message.innerHTML = `Punkte: ${score}<br>Drücke START für eine neue Runde.`;
        overlay.hidden = false;
        startButton.textContent = "NEUSTART";
      }

      function step() {
        direction = nextDirection;
        const head = {
          x: snake[0].x + direction.x,
          y: snake[0].y + direction.y
        };
        const eating = food && head.x === food.x && head.y === food.y;
        const body = eating ? snake : snake.slice(0, -1);

        if (
          head.x < 0 || head.x >= cells || head.y < 0 || head.y >= cells ||
          body.some((part) => part.x === head.x && part.y === head.y)
        ) {
          endGame();
          return;
        }

        snake.unshift(head);
        if (eating) {
          score += 10;
          scoreLabel.textContent = score;
          if (score > best) {
            best = score;
            bestLabel.textContent = best;
            saveBest();
          }
          placeFood();
          if (!food) {
            draw();
            endGame(true);
            return;
          }
        } else {
          snake.pop();
        }
        draw();
      }

      function turn(dx, dy) {
        if (state === "ready" || state === "over") start();
        if (state === "paused") return;
        if (dx === -direction.x && dy === -direction.y) return;
        nextDirection = { x: dx, y: dy };
      }

      const keyDirections = {
        ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
        ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
        ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
        ArrowRight: [1, 0], d: [1, 0], D: [1, 0]
      };

      document.addEventListener("keydown", (event) => {
        if (keyDirections[event.key]) {
          event.preventDefault();
          turn(...keyDirections[event.key]);
        } else if (event.code === "Space") {
          event.preventDefault();
          if (state === "running") pause();
          else if (state === "paused") start();
          else start();
        }
      });

      document.querySelectorAll("[data-direction]").forEach((button) => {
        button.addEventListener("click", () => {
          const directions = {
            up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0]
          };
          turn(...directions[button.dataset.direction]);
        });
      });

      startButton.addEventListener("click", () => {
        if (state === "running") pause();
        else start();
      });

      reset();
    })();
  </script>
</body>
</html>
